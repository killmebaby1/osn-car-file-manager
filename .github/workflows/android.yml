name: Android CI

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v5
      with:
        submodules: true
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Build debug APK
      run: ./gradlew assembleDebug
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
    - name: Publish latest release (direct APK download)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest --yes --cleanup-tag || true
        gh release create latest app/build/outputs/apk/debug/app-debug.apk \
          --title "车机文件管理 latest" \
          --notes "GitHub Actions 自动构建的最新 debug 安装包。下载地址：https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk"
